market: fi2010
model: xgboost

data:
  # Prediction horizon k=10 events ahead — standard for published FI-2010 baselines (build.md §2.1)
  horizon_k: 10
  standardize: true

model_params:
  # Frozen after `make tune` (A3 — do not leave null or train_tree_model raises).
  # Replace with Optuna best params once tuning is complete.
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  reg_lambda: 1.0

imbalance:
  strategy: class_weight  # class_weight | focal_loss | none

training:
  seeds: [0, 1, 2, 3, 4]

output_dir: results/fi2010_xgboost/
