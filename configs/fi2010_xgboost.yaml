market: fi2010
model: xgboost

data:
  # Prediction horizon k=10 events ahead — standard for published FI-2010 baselines (build.md §2.1)
  horizon_k: 10
  standardize: true

model_params:
  # null triggers Optuna search. Optuna search space (build.md §7.4):
  #   n_estimators: categorical {50, 100, 200}
  #   max_depth: int in [3, 10]
  # sample_weight (class-balanced) is passed at .fit() time; XGBoost multi-class
  # does not support class_weight in the constructor.
  n_estimators: null
  max_depth: null

imbalance:
  strategy: class_weight  # class_weight | focal_loss | none

training:
  seeds: [0, 1, 2, 3, 4]

output_dir: results/fi2010_xgboost/
