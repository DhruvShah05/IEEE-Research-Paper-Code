market: fi2010
model: random_forest

data:
  # Prediction horizon k=10 events ahead — standard for published FI-2010 baselines (build.md §2.1)
  horizon_k: 10
  standardize: true

model_params:
  # Frozen after `make tune` (A3 — do not leave null or train_tree_model raises).
  # Replace with Optuna best params once tuning is complete.
  # RF uses class_weight='balanced' in constructor; no sample_weight at fit() time.
  n_estimators: 200
  max_depth: 15
  min_samples_leaf: 5
  max_features: sqrt

imbalance:
  strategy: class_weight  # class_weight | focal_loss | none

training:
  seeds: [0, 1, 2, 3, 4]

output_dir: results/fi2010_random_forest/
