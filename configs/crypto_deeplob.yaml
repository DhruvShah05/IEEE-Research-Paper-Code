market: crypto
model: deeplob

data:
  crypto_window_days: [1, 3]
  horizon_events: 40
  threshold: 0.0001
  standardize: true

model_params:
  variant: windowed   # real DeepLOB (Zhang et al. 2019)
  T: 100              # sequence length
  lstm_hidden: 64

imbalance:
  strategy: class_weight

training:
  max_epochs: 50
  patience: 5
  batch_size: 2048    # windowed (T=100) → larger tensors; 2048 safe for 32 GB VRAM
  num_workers: 8
  learning_rate: 0.001
  weight_decay: 1.0e-4
  scheduler: cosine
  grad_clip: 1.0
  seeds: [0, 1, 2, 3, 4]

gpu:
  amp: true
  compile: true
  compile_mode: reduce-overhead

output_dir: results/crypto_deeplob/
