market: crypto
model: xgboost

data:
  crypto_window_days: [1, 3]  # use days 1-3 of the 12-day source window
  # horizon_events and threshold set after the threshold sweep (build.md §2.2, §7.1)
  horizon_events: 40
  threshold: 0.0001  # ±1 basis point
  standardize: true

model_params:
  # null triggers Optuna search. Optuna search space (build.md §7.4):
  #   n_estimators: categorical {50, 100, 200}
  #   max_depth: int in [3, 10]
  # sample_weight (class-balanced) passed at .fit() time for imbalance handling.
  n_estimators: null
  max_depth: null

imbalance:
  strategy: class_weight  # class_weight | focal_loss | none

training:
  seeds: [0, 1, 2, 3, 4]

output_dir: results/crypto_xgboost/
