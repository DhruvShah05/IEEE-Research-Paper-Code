market: crypto
model: random_forest

data:
  crypto_window_days: [1, 3]  # use days 1-3 of the 12-day source window
  # horizon_events and threshold set after the threshold sweep (build.md §2.2, §7.1)
  # Results are in results/threshold_sweep_f1.csv; these values are justified by RF/XGB Macro-F1 there.
  horizon_events: 40
  threshold: 0.0001  # ±1 basis point
  standardize: true

model_params:
  # Frozen after `make tune` (A3 — do not leave null or train_tree_model raises).
  # Replace with Optuna best params once tuning is complete.
  # RF uses class_weight='balanced' in constructor; no sample_weight at fit() time.
  n_estimators: 200
  max_depth: 15
  min_samples_leaf: 5
  max_features: sqrt

imbalance:
  strategy: class_weight  # class_weight | focal_loss | none

training:
  seeds: [0, 1, 2, 3, 4]

output_dir: results/crypto_random_forest/
