market: crypto
model: structured_transformer

data:
  crypto_window_days: [1, 3]  # use days 1-3 of the 12-day source window
  horizon_events: 40
  threshold: 0.0001  # ±1 basis point — resolved via threshold sweep (build.md §7.1)
  standardize: true

model_params:
  token_mode: level        # best ablation result (LOB-level tokens)
  pooling_mode: attention
  d_model: 64
  nhead: 4
  num_layers: 2
  dropout: 0.1

imbalance:
  strategy: class_weight   # class_weight | focal_loss | none

training:
  max_epochs: 50
  patience: 5
  # RTX 5080 (32 GB VRAM): batch_size 4096 fills ~1-2 GB for this model size;
  # use 8192 if GPU util is < 80% (check with `nvidia-smi`).
  batch_size: 4096
  num_workers: 8           # match physical CPU cores / 2
  learning_rate: 0.001
  weight_decay: 1.0e-4
  scheduler: cosine
  grad_clip: 1.0
  seeds: [0, 1, 2, 3, 4]

gpu:
  amp: true               # bfloat16 AMP (RTX 5080 Blackwell supports bf16 natively)
  compile: true           # torch.compile — ~15-30% speedup for Transformers
  compile_mode: reduce-overhead  # 'default' | 'reduce-overhead' | 'max-autotune'

output_dir: results/crypto_structured_transformer/
