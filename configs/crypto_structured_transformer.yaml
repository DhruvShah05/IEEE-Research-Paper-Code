market: crypto
model: structured_transformer

data:
  crypto_window_days: [1, 3]  # use days 1-3 of the 12-day source window
  horizon_events: 40
  threshold: 0.0001  # ±1 basis point — resolved via threshold sweep (build.md §7.1)
  standardize: true

model_params:
  # Ablation flags (build.md §7.3). Independent — each can be changed without affecting the other:
  #   token_mode:   flat (scalar tokens, like standard Transformer) | grouped (level-pair tokens)
  #   pooling_mode: mean | cls | attention
  # The ablation script sweeps all 4 combinations; these are the headline defaults.
  token_mode: grouped
  pooling_mode: attention

imbalance:
  strategy: class_weight  # class_weight | focal_loss | none

training:
  epochs: 15
  batch_size: 256
  learning_rate: 0.001
  seeds: [0, 1, 2, 3, 4]

output_dir: results/crypto_structured_transformer/
