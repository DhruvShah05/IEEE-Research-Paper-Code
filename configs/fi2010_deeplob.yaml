market: fi2010
model: deeplob

data:
  # Prediction horizon k=10 events ahead — standard for published FI-2010 baselines (build.md §2.1)
  horizon_k: 10
  standardize: true

imbalance:
  strategy: class_weight  # class_weight | focal_loss | none

training:
  epochs: 15
  batch_size: 256
  learning_rate: 0.001
  seeds: [0, 1, 2, 3, 4]

output_dir: results/fi2010_deeplob/
