market: fi2010
model: deeplob

data:
  horizon_k: 10
  standardize: true
  feature_set: raw40   # real DeepLOB uses 40-feature raw LOB (not the 144-col set)

model_params:
  variant: windowed    # real DeepLOB (Zhang et al. 2019)
  T: 100               # sequence length
  lstm_hidden: 64

imbalance:
  strategy: class_weight

training:
  max_epochs: 50
  patience: 5
  # T=100 windows are larger; 2048 is safe at 32 GB; try 4096 if VRAM headroom exists
  batch_size: 2048
  num_workers: 8
  learning_rate: 0.001
  weight_decay: 1.0e-4
  scheduler: cosine
  grad_clip: 1.0
  seeds: [0, 1, 2, 3, 4]

gpu:
  amp: true
  compile: true
  compile_mode: reduce-overhead

output_dir: results/fi2010_deeplob/
