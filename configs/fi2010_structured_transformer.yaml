market: fi2010
model: structured_transformer

data:
  horizon_k: 10       # standard FI-2010 k=10 horizon (Ntakaris et al. 2018)
  standardize: true
  feature_set: full144

model_params:
  token_mode: level        # best ablation result (LOB-level tokens)
  pooling_mode: attention
  d_model: 64
  nhead: 4
  num_layers: 2
  dropout: 0.1

imbalance:
  strategy: class_weight

training:
  max_epochs: 50
  patience: 5
  # FI-2010 train = ~200k rows after split; 4096 fills GPU nicely
  batch_size: 4096
  num_workers: 8
  learning_rate: 0.001
  weight_decay: 1.0e-4
  scheduler: cosine
  grad_clip: 1.0
  seeds: [0, 1, 2, 3, 4]

gpu:
  amp: true
  compile: true
  compile_mode: reduce-overhead

output_dir: results/fi2010_structured_transformer/
