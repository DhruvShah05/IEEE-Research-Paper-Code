market: crypto
model: transformer

data:
  crypto_window_days: [1, 3]
  horizon_events: 40
  threshold: 0.0001
  standardize: true

model_params:
  d_model: 64
  nhead: 4
  num_layers: 2
  dropout: 0.1
  token_mode: scalar   # 'scalar' (snapshot) or 'temporal' (windowed)

imbalance:
  strategy: class_weight

training:
  max_epochs: 50
  patience: 5
  batch_size: 4096    # RTX 5080: scalar-token Transformer is tiny; 4096-8192 is fine
  num_workers: 8
  learning_rate: 0.001
  weight_decay: 1.0e-4
  scheduler: cosine
  grad_clip: 1.0
  seeds: [0, 1, 2, 3, 4]

gpu:
  amp: true
  compile: true
  compile_mode: reduce-overhead

output_dir: results/crypto_transformer/
